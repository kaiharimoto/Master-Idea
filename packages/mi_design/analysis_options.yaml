# The design system, held to the repository's rules and to Flutter's.
#
# There was no file here at all, so the `flutter_lints` dependency in this
# package's pubspec was inert: none of the Flutter rules it exists for ever
# ran.
include:
  - ../../analysis_options.yaml
  - package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
    # Flutter's own, which the root file has no reason to name.
    - use_key_in_widget_constructors
    - sized_box_for_whitespace
    - avoid_unnecessary_containers
