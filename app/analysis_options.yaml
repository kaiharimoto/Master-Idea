# The app is held to the same standard as the packages, and to Flutter's own
# lints on top of it.
#
# It was the stock template: `flutter_lints` alone, with none of the strict
# language modes and none of the extra rules the three packages have had since
# the first commit — so the largest and least-tested body of code in the
# repository was the one analysed least. `parity.md` claimed otherwise.
include:
  - ../analysis_options.yaml
  - package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - windows/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
    # Flutter's own, which the root file has no reason to name.
    - use_key_in_widget_constructors
    - sized_box_for_whitespace
    - avoid_unnecessary_containers
