# Signing credentials for the throwaway development key.
#
# These are public by design — see the note in app/build.gradle.kts. The key
# exists purely so consecutive builds are signed identically, which is what
# lets a new build install over the old one without wiping stored sessions.
#
# NEVER use this key for a Play Store release.
storeFile=dev-keystore.jks
storePassword=masteridea-dev
keyAlias=dev
keyPassword=masteridea-dev
