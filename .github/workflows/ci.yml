name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  # The fingerprint of app/android/dev-keystore.jks, asserted after every APK
  # is built. The signing config is the most failure-prone piece of this
  # pipeline and getting it wrong is invisible until a device refuses the
  # install — by which time the build everyone is running cannot be updated
  # without an uninstall that takes their stored sessions with it.
  DEV_KEY_SHA256: '618b2260d0c48fb11b80e0046f41b9e749f13a989060207a14e9d7e9e62de4e4'

jobs:
  core:
    name: Core (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Flutter here on purpose. mi_core carries the logic that has to be
      # right when a sitting is five hours in and unattended, and it is kept
      # analysable and testable in seconds without a 2.5 GB SDK. If this job
      # ever needs Flutter, that property has been lost.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: mi_core
        working-directory: packages/mi_core
        run: |
          dart pub get
          dart analyze
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded

  engine:
    name: Engine (pure Dart, dart:io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Compiles and drives a fake `claude` binary that refuses what the real
      # one refuses, so the transport, the argument composition and the whole
      # headless spine are exercised without an API key.
      - name: mi_engine
        working-directory: packages/mi_engine
        run: |
          dart pub get
          dart analyze
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the build number
        run: .github/build-number.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `flutter analyze` in app/ covers only the app package, so an error in
      # the design system would otherwise reach a device rather than CI.
      - name: Analyse and test the design system
        working-directory: packages/mi_design
        run: |
          flutter pub get
          flutter analyze
          dart format --output=none --set-exit-if-changed .
          flutter test

      - name: Resolve, analyse, test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          dart format --output=none --set-exit-if-changed .
          flutter test

      # The version code has to rise with every build, or Android treats a new
      # APK as the same version as the installed one — and while it will
      # usually still install, nothing about "this is newer" is true from the
      # system's point of view. Flutter takes it from pubspec's `version:`,
      # so that is what gets stamped.
      - name: Stamp the build number into the version
        run: |
          sed -i "s/^version: .*/version: ${{ env.MI_VERSION }}+${{ env.MI_BUILD }}/" app/pubspec.yaml
          grep '^version:' app/pubspec.yaml

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=MI_BUILD=${{ env.MI_BUILD }} --dart-define=MI_VERSION=${{ env.MI_VERSION }} \
            --dart-define=MI_SHA=${{ github.sha }}

      # Asserted rather than trusted: every build must carry the same
      # certificate, or the next one will not install over this one.
      - name: Verify the APK is signed with the dev key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          ACTUAL=$(grep -i 'SHA-256 digest' /tmp/certs.txt | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          echo "expected $DEV_KEY_SHA256"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$DEV_KEY_SHA256" ]; then
            echo "::error::APK is not signed with the committed dev key. New builds would refuse to install over the previous one."
            exit 1
          fi

      # The name is the update protocol: the app reads the build number and
      # the commit straight out of it, so a renamed asset is an asset no
      # installed copy can see.
      - name: Name the artifact
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "out/MasterIdea-${{ env.MI_BUILD }}-$(echo ${{ github.sha }} | cut -c1-7).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the build number
        shell: bash
        run: .github/build-number.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve, analyse, test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          dart format --output=none --set-exit-if-changed .
          flutter test

      # The build number has to reach the exe's VERSIONINFO, not just the Dart
      # side, or Windows sees every build as 0.1.0.1 and an installer cannot
      # tell an upgrade from a reinstall. Flutter derives that resource from
      # pubspec's `version:`, so that is what gets stamped.
      #
      # CompanyName and ProductName are deliberately NOT touched here: on
      # Windows they decide where saved sessions live at runtime.
      - name: Stamp the build number into the version
        shell: pwsh
        run: |
          $p = "app/pubspec.yaml"
          (Get-Content $p) -replace '^version: .*$', `
            'version: ${{ env.MI_VERSION }}+${{ env.MI_BUILD }}' | Set-Content $p
          Select-String -Path $p -Pattern '^version:'

      # The only place a Windows binary can be produced — Flutter desktop needs
      # a Windows host. This is why the engine lives in a plain dart:io package
      # that is proven on Linux first.
      - name: Build release
        working-directory: app
        run: |
          flutter build windows --release `
            --dart-define=MI_BUILD=${{ env.MI_BUILD }} --dart-define=MI_VERSION=${{ env.MI_VERSION }} `
            --dart-define=MI_SHA=${{ github.sha }}

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not present; installing."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still not at $iscc" }
          Write-Host "using $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & "$env:ISCC" `
            "/DAppVersion=${{ env.MI_VERSION }}.${{ env.MI_BUILD }}" `
            "/DBuildDir=..\..\build\windows\x64\runner\Release" `
            "/DOutputDir=..\..\..\out" `
            "/DOutputBase=MasterIdeaSetup-${{ env.MI_BUILD }}-$sha" `
            "app\windows\installer\master_idea.iss"
          Get-ChildItem out

      # Published alongside the installer for anyone who wants a portable copy,
      # and recognised by the updater as a second-choice asset.
      - name: Package portable zip
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "out/MasterIdea-windows-x64-${{ env.MI_BUILD }}-$sha.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.exe
            out/*.zip
          retention-days: 14

  # The screens, rendered.
  #
  # Never compared: font rasterisation differs between machines and a pixel
  # diff on a runner goes red for reasons that have nothing to do with the
  # design. What this catches is the other thing — a region that throws while
  # rendering, which no assertion in the suite would notice because the shots
  # are skipped by default. They are uploaded so a change to a screen can be
  # looked at rather than argued about.
  shots:
    name: The screens render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Render them
        working-directory: app
        run: |
          flutter pub get
          flutter test --tags shots --run-skipped --update-goldens

      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: app/test/shots/*.png
          retention-days: 14

  judgeset:
    name: The judgeset is frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The ten critic prompts, the rating vocabularies and the deduction table
      # are committed before the first review cycle and unchanged afterwards. A
      # rubric whose deductions move between cycles cannot show progress, only
      # motion. This job does nothing until the first cycle opens — the marker
      # file below is written then — and fails loudly afterwards.
      - name: Refuse a change to critics/ after cycle one has opened
        run: |
          if [ ! -f critics/.frozen-at ]; then
            echo "No cycle has opened yet; critics/ is still being written."
            exit 0
          fi
          FROZEN=$(cat critics/.frozen-at)
          echo "judgeset frozen at $FROZEN"
          if ! git diff --quiet "$FROZEN" HEAD -- critics/; then
            echo "::error::critics/ changed after the judgeset was frozen."
            git diff --stat "$FROZEN" HEAD -- critics/
            exit 1
          fi

  publish-dev:
    name: Publish the rolling dev build
    needs: [core, engine, android, windows, judgeset]
    # Real pushes only, and only from a branch builds are meant to come from.
    # The default branch is the usual answer; until this repository has one
    # with anything on it, the development branch is where installable builds
    # come from and a build nobody can download is not a build.
    # Real pushes only, from the default branch or any development branch.
    # Pinning one branch name meant every session after the one that wrote it
    # built green and published nothing, while the release page users are told
    # to bookmark kept serving a build from weeks ago — and an installed copy
    # that stops seeing updates says nothing about it. See decision 0013.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/heads/claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out for the build number alone: the release notes name it, and
      # it has to be the same number the artifacts were built with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the build number
        run: .github/build-number.sh

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Assets carry their build number so a downloaded file is identifiable
      # later, which means a new build adds files rather than replacing them.
      # Without this the page accumulates every build and you have to work out
      # which one is newest — exactly the guessing the release notes promise
      # you will not have to do.
      - name: Note which assets are already there
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/tags/dev" \
            --jq '.assets[] | "\(.id) \(.name)"' 2>/dev/null > /tmp/old-assets.txt || true
          cat /tmp/old-assets.txt || true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest development build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            The newest build of Master Idea. This tag always points at the most
            recent green commit, so this page is worth bookmarking — the link
            never changes.

            | | |
            |---|---|
            | Build | `${{ env.MI_BUILD }}` |
            | Commit | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |

            **Android** — download the `.apk` and open it. The first time,
            Android will ask you to allow installs from your browser. Later
            builds install straight over this one and keep every stored
            session, because every build is signed with the same key.

            A phone has no Claude CLI, so a sitting there is carried by hand:
            the app gives you each turn to send and takes back what comes of
            it. It is never unattended, which is why the smallest tier is the
            honest one on a phone.

            **Windows** — download `MasterIdeaSetup-*.exe` and run it. It
            installs for you only, so there is no administrator prompt, and it
            adds a Start-menu entry and an uninstaller like any other program.
            SmartScreen will warn that the publisher is unknown, because the
            installer is unsigned: choose *More info* then *Run anyway*.

            After that you should not need this page. The app checks here at
            launch, and updating is one click from inside it — on Windows it
            closes, replaces itself and reopens. The `.zip` is still published
            for anyone who wants a portable copy.

            Found something wrong? Open Settings, tap **Copy diagnostics**, and
            paste that into the chat.
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.exe
            artifacts/windows/*.zip

      # After the upload, never before it. Assets carry their build number, so
      # a new build adds files rather than replacing them and the page would
      # otherwise accumulate every build ever made — but deleting first leaves
      # a window where the page users are told to bookmark has nothing on it
      # at all, and an upload that fails in that window leaves it that way.
      - name: Remove the previous build's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s /tmp/old-assets.txt ] || exit 0
          while read -r id name; do
            echo "removing $name ($id)"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done < /tmp/old-assets.txt
